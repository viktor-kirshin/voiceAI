[project]
name = "voice"
version = "0.1.0"
description = "FastAPI service: stereo call-center audio -> Whisper (vLLM) transcription -> Gemma (vLLM) per-segment sentiment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "openai>=1.55",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "soundfile>=0.12",
    "numpy>=2.1",
]

[project.scripts]
voice = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
